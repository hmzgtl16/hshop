spring.application.name=hshop-api

spring.datasource.url=jdbc:postgresql://localhost:5432/hshop_db
spring.datasource.username=hshop_user
spring.datasource.password=hshop_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.separator=;
spring.sql.init.continue-on-error=false

logging.level.com.example.hshop.api=DEBUG
logging.level.org.springframework.jdbc=DEBUG